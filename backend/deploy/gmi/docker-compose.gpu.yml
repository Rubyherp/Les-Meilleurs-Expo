# ── GPU analysis worker compose override ─────────────────────────────────────
# Use: docker compose -f deploy/gmi/docker-compose.gpu.yml up -d
#
# Runs the GMI GPU image alongside the existing infrastructure services.
# The CPU api/worker services are NOT started by this file — use the root
# docker-compose.yml for those.

services:
  gpu-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.gmi
    image: les-meilleurs-backend:gmi
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/video_analysis
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      ML_DEVICE: cuda
      GMI_ENABLED: "true"
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ../../models:/service/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_analysis
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d video_analysis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
